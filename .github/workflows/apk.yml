name: APK bauen

# Baut die installierbare Debug-APK. Läuft bei jedem Push und lässt sich
# unter "Actions" auch von Hand starten. Das Ergebnis liegt danach als
# Artifact "offene-fahrten-apk" zum Herunterladen bereit.

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Java 17 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK einrichten
        uses: android-actions/setup-android@v3

      - name: Gradle einrichten
        uses: gradle/actions/setup-gradle@v4

      - name: Debug-APK bauen
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: APK hochladen
        uses: actions/upload-artifact@v4
        with:
          name: offene-fahrten-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
